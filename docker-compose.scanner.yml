services:
  scanner:
    build:
      context: ./scanner
      args:
        NUCLEI_VERSION: ${NUCLEI_VERSION:-v3.11.0}
        HTTPX_VERSION: ${HTTPX_VERSION:-v1.9.0}
        NAABU_VERSION: ${NAABU_VERSION:-v2.6.1}
        KATANA_VERSION: ${KATANA_VERSION:-v1.6.1}
        SUBFINDER_VERSION: ${SUBFINDER_VERSION:-v2.14.0}
        DNSX_VERSION: ${DNSX_VERSION:-v1.2.3}
        AFROG_VERSION: ${AFROG_VERSION:-v3.5.3}
        FFUF_VERSION: ${FFUF_VERSION:-v2.1.0}
        UNCOVER_VERSION: ${UNCOVER_VERSION:-3f7b74af20b24a7d5477d1dc77f6ba881219b0de}
        URLFINDER_VERSION: ${URLFINDER_VERSION:-ad920f8f07e314b4f242967565601bd77f005947}
        TLSX_VERSION: ${TLSX_VERSION:-d13b67f3068c9c784646b57fed0e8cccb268f0f1}
        ALTERX_VERSION: ${ALTERX_VERSION:-bae701c363da0fecf5e788322188df9f4d419bef}
        CDNCHECK_VERSION: ${CDNCHECK_VERSION:-0adc3138f381f86cba14c75f7aa688177167a192}
        GAU_VERSION: ${GAU_VERSION:-8201b9d1febadba98e9cb81e3f253284e8a4a88b}
    image: arl-plus-scanner:2026.07-v2
    profiles:
      - scanner
    working_dir: /work
    environment:
      TZ: Asia/Shanghai
      HOME: /root
      SCAN_MODE: ${SCAN_MODE:-standard}
      UPDATE_TEMPLATES: ${UPDATE_TEMPLATES:-true}

      ENABLE_SCANNER_V2: ${ENABLE_SCANNER_V2:-true}
      ENABLE_SUBFINDER: ${ENABLE_SUBFINDER:-true}
      ENABLE_UNCOVER: ${ENABLE_UNCOVER:-true}
      ENABLE_NAABU: ${ENABLE_NAABU:-true}
      ENABLE_KATANA: ${ENABLE_KATANA:-true}
      ENABLE_SOURCEMAP: ${ENABLE_SOURCEMAP:-true}
      ENABLE_PASSIVE_URLS: ${ENABLE_PASSIVE_URLS:-true}
      ENABLE_TLSX: ${ENABLE_TLSX:-true}
      ENABLE_CDNCHECK: ${ENABLE_CDNCHECK:-true}
      ENABLE_ALTERX: ${ENABLE_ALTERX:-}
      ALTERX_CURATED_WORDS: ${ALTERX_CURATED_WORDS:-true}
      ENABLE_SECONDARY_CRAWL: ${ENABLE_SECONDARY_CRAWL:-}
      ENABLE_SOURCEMAP_V2: ${ENABLE_SOURCEMAP_V2:-true}
      ENABLE_FFUF_V2: ${ENABLE_FFUF_V2:-}
      ENABLE_CONTENT_AUDIT: ${ENABLE_CONTENT_AUDIT:-true}
      ENABLE_NUCLEI: ${ENABLE_NUCLEI:-true}
      ENABLE_NUCLEI_AUTOMATIC: ${ENABLE_NUCLEI_AUTOMATIC:-true}
      ENABLE_NUCLEI_EXPOSURE: ${ENABLE_NUCLEI_EXPOSURE:-true}
      ENABLE_NUCLEI_API: ${ENABLE_NUCLEI_API:-true}
      ENABLE_NUCLEI_NETWORK: ${ENABLE_NUCLEI_NETWORK:-true}
      ENABLE_NUCLEI_DNS: ${ENABLE_NUCLEI_DNS:-true}
      ENABLE_AFROG: ${ENABLE_AFROG:-true}
      ENABLE_FFUF: ${ENABLE_FFUF:-true}

      UNCOVER_PROVIDER_CONFIG: ${UNCOVER_PROVIDER_CONFIG:-/run/secrets/uncover-provider.yaml}
      UNCOVER_ENGINES: ${UNCOVER_ENGINES:-auto}
      UNCOVER_LIMIT: ${UNCOVER_LIMIT:-100}
      UNCOVER_RATE_LIMIT: ${UNCOVER_RATE_LIMIT:-2}
      UNCOVER_ACCEPT_IP_ONLY: ${UNCOVER_ACCEPT_IP_ONLY:-false}
      UNCOVER_EXPANDED_QUERIES_OVERRIDE: ${UNCOVER_EXPANDED_QUERIES_OVERRIDE:-}

      URLFINDER_RATE_LIMIT: ${URLFINDER_RATE_LIMIT:-10}
      URLFINDER_MAX_TIME: ${URLFINDER_MAX_TIME:-5}
      GAU_THREADS: ${GAU_THREADS:-5}
      GAU_TIMEOUT: ${GAU_TIMEOUT:-30}
      GAU_PROVIDERS: ${GAU_PROVIDERS:-wayback,commoncrawl,otx,urlscan}
      PASSIVE_URL_LIMIT: ${PASSIVE_URL_LIMIT:-}
      ALTERX_LIMIT: ${ALTERX_LIMIT:-}
      TLSX_CONCURRENCY: ${TLSX_CONCURRENCY:-100}
      DNSX_ENRICH_RATE_LIMIT: ${DNSX_ENRICH_RATE_LIMIT:-300}
      HTTPX_ENRICH_THREADS: ${HTTPX_ENRICH_THREADS:-40}
      HTTPX_PASSIVE_THREADS: ${HTTPX_PASSIVE_THREADS:-50}
      SECONDARY_CRAWL_TARGET_LIMIT: ${SECONDARY_CRAWL_TARGET_LIMIT:-500}
      SOURCEMAP_V2_LIMIT: ${SOURCEMAP_V2_LIMIT:-}
      SOURCEMAP_V2_RATE_LIMIT: ${SOURCEMAP_V2_RATE_LIMIT:-60}
      FFUF_V2_MAX_TARGETS: ${FFUF_V2_MAX_TARGETS:-}
      FFUF_V2_RATE: ${FFUF_V2_RATE:-50}
      FFUF_V2_MAXTIME: ${FFUF_V2_MAXTIME:-180}
      CONTENT_AUDIT_LIMIT: ${CONTENT_AUDIT_LIMIT:-}
      CONTENT_AUDIT_WORKERS: ${CONTENT_AUDIT_WORKERS:-10}
      CONTENT_AUDIT_TIMEOUT: ${CONTENT_AUDIT_TIMEOUT:-10}
      CONTENT_AUDIT_MAX_BYTES: ${CONTENT_AUDIT_MAX_BYTES:-1048576}
      V2_SCAN_URL_LIMIT: ${V2_SCAN_URL_LIMIT:-}

      NUCLEI_POLICY: ${NUCLEI_POLICY:-auto}
      NUCLEI_SHOW_FINDINGS: ${NUCLEI_SHOW_FINDINGS:-true}
      NUCLEI_REPORT_LIMIT: ${NUCLEI_REPORT_LIMIT:-100}
      NUCLEI_TEMPLATE_DIR: ${NUCLEI_TEMPLATE_DIR:-/root/nuclei-templates}
      NUCLEI_TEMPLATE_MIN_COUNT: ${NUCLEI_TEMPLATE_MIN_COUNT:-50}
      NUCLEI_EXCLUDE_TAGS: ${NUCLEI_EXCLUDE_TAGS:-dos,fuzz,intrusive,bruteforce}
      NUCLEI_EXPOSURE_TAGS: ${NUCLEI_EXPOSURE_TAGS:-exposure,config,files,backup,token,logs,debug,misconfig}
      NUCLEI_API_TAGS: ${NUCLEI_API_TAGS:-api,swagger,openapi,graphql,webhook}
      NUCLEI_NETWORK_TAGS: ${NUCLEI_NETWORK_TAGS:-network,ssl}
      NUCLEI_DNS_TAGS: ${NUCLEI_DNS_TAGS:-dns,takeover}
      NUCLEI_EXTRA_SEVERITY: ${NUCLEI_EXTRA_SEVERITY:-info,low,medium,high,critical}
      NUCLEI_EXTRA_CONCURRENCY: ${NUCLEI_EXTRA_CONCURRENCY:-20}
      NUCLEI_BULK_SIZE: ${NUCLEI_BULK_SIZE:-20}
      NUCLEI_TIMEOUT: ${NUCLEI_TIMEOUT:-10}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-120}

      HTTPX_RATE_LIMIT: ${HTTPX_RATE_LIMIT:-150}
      NAABU_RATE: ${NAABU_RATE:-500}
      FFUF_RATE: ${FFUF_RATE:-50}
      FFUF_MAX_TARGETS: ${FFUF_MAX_TARGETS:-100}
      ALLOW_LARGE_CIDR: ${ALLOW_LARGE_CIDR:-false}
      MAX_IPV4_CIDR_ADDRESSES: ${MAX_IPV4_CIDR_ADDRESSES:-4096}
      MAX_IPV6_CIDR_ADDRESSES: ${MAX_IPV6_CIDR_ADDRESSES:-256}
      CUSTOM_PORTS: ${CUSTOM_PORTS:-}
      TOP_PORTS_OVERRIDE: ${TOP_PORTS_OVERRIDE:-}
      NAABU_SERVICE_VERSION_OVERRIDE: ${NAABU_SERVICE_VERSION_OVERRIDE:-}
      SCAN_URL_LIMIT_OVERRIDE: ${SCAN_URL_LIMIT_OVERRIDE:-}
      NUCLEI_SEVERITY_OVERRIDE: ${NUCLEI_SEVERITY_OVERRIDE:-}
      AFROG_SEVERITY_OVERRIDE: ${AFROG_SEVERITY_OVERRIDE:-}
    volumes:
      - ./scan-results:/work/results
      - ./scanner-cache/config:/root/.config
      - ./scanner-cache/nuclei-templates:/root/nuclei-templates
      - ./scanner-pocs/nuclei:/opt/pocs/nuclei:ro
      - ./scanner-pocs/afrog:/opt/pocs/afrog:ro
      - ./scanner-secrets:/run/secrets:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command:
      - sleep
      - infinity
