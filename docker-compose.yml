version: '3'

volumes:
    arl_db:
        external: true
    arl_mcp_data:

services:
    web:
        image: ${ARL_WEB_IMAGE:-ki9mu/arl-ki9mu:v3.0.1}
        container_name: arl_web
        restart: unless-stopped
        depends_on:
          - mongodb
          - rabbitmq
        ports:
          #http 服务，默认不映射出来
          #- "5003:80"
          - "5003:443"
        volumes:
          - ./arl_web.log:/code/arl_web.log
          - ./config-docker.yaml:/code/app/config.yaml
          - ./image:/code/app/tmp_screenshot
          - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
          - "${ARL_REPORT_ROOT:-/var/lib/arl-reports}:/code/frontend/report:ro"
        entrypoint: ["sh", "-c", "gen_crt.sh; nginx; wait-for-it.sh mongodb:27017; wait-for-it.sh rabbitmq:5672; gunicorn -b 0.0.0.0:5003 app.main:arl_app -w 3 --access-logfile arl_web.log --access-logformat '%({x-real-ip}i)s %(l)s %(u)s %(t)s \"%(r)s\" %(s)s %(b)s \"%(f)s\" \"%(a)s\"'"]
        environment:
          - LANG=en_US.UTF-8
          - TZ=Asia/Shanghai

    worker:
        image: ${ARL_WORKER_IMAGE:-ki9mu/arl-ki9mu:v3.0.1}
        container_name: arl_worker
        restart: unless-stopped
        depends_on:
          - mongodb
          - rabbitmq
        volumes:
          - ./arl_worker.log:/code/arl_worker.log
          - ./config-docker.yaml:/code/app/config.yaml
          - ./image:/code/app/tmp_screenshot
          - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
          - "${ARL_REPORT_ROOT:-/var/lib/arl-reports}:/var/lib/arl-reports"
        entrypoint: ["sh", "-c", "wait-for-it.sh mongodb:27017; wait-for-it.sh rabbitmq:5672;
        celery -A app.celerytask.celery worker -l info -Q arlgithub -n arlgithub -c 2 -O fair -f arl_worker.log &
         celery -A app.celerytask.celery worker -l info -Q arltask -n arltask -c 2 -O fair -f arl_worker.log"]

        environment:
          - LANG=en_US.UTF-8
          - TZ=Asia/Shanghai
          - WILDCARD_SMART_FILTER=${WILDCARD_SMART_FILTER:-true}
          - WILDCARD_BASELINE_SAMPLES=${WILDCARD_BASELINE_SAMPLES:-3}
          - WILDCARD_VERIFY_MAX=${WILDCARD_VERIFY_MAX:-500}
          - WILDCARD_HTTP_CONCURRENCY=${WILDCARD_HTTP_CONCURRENCY:-20}
          - WILDCARD_HTTP_TIMEOUT=${WILDCARD_HTTP_TIMEOUT:-6}
          - WILDCARD_BODY_MAX_BYTES=${WILDCARD_BODY_MAX_BYTES:-262144}
          - WILDCARD_SIMILARITY_THRESHOLD=${WILDCARD_SIMILARITY_THRESHOLD:-0.78}
          - WILDCARD_KEEP_UNKNOWN_PASSIVE=${WILDCARD_KEEP_UNKNOWN_PASSIVE:-true}
          - ARL_NUCLEI_TAGS=${ARL_NUCLEI_TAGS:-cve,exposure,config,files,backup,token,logs,debug,misconfig,api,swagger,openapi,graphql,webhook}
          - ARL_NUCLEI_SEVERITY=${ARL_NUCLEI_SEVERITY:-info,low,medium,high,critical}
          - ARL_NUCLEI_EXCLUDE_TAGS=${ARL_NUCLEI_EXCLUDE_TAGS:-dos,fuzz,intrusive,bruteforce}
          - ARL_NUCLEI_RATE_LIMIT=${ARL_NUCLEI_RATE_LIMIT:-120}
          - ARL_NUCLEI_BULK_SIZE=${ARL_NUCLEI_BULK_SIZE:-20}
          - ARL_NUCLEI_TIMEOUT=${ARL_NUCLEI_TIMEOUT:-10}
          - ARL_NUCLEI_RETRIES=${ARL_NUCLEI_RETRIES:-1}
          - ARL_REPORT_ROOT=/var/lib/arl-reports
          - REPORT_WORLD_READABLE=${REPORT_WORLD_READABLE:-false}
          - AFROG_PROXY_URL=${AFROG_PROXY_URL:-}
          - AFROG_CALLBACK_DOMAIN=${AFROG_CALLBACK_DOMAIN:-callback.red}
          - AFROG_CALLBACK_API_URL=${AFROG_CALLBACK_API_URL:-http://callback.red}

    scheduler:
      image: ${ARL_SCHEDULER_IMAGE:-ki9mu/arl-ki9mu:v3.0.1}
      container_name: arl_scheduler
      restart: unless-stopped
      depends_on:
        - mongodb
        - rabbitmq
      volumes:
        - ./config-docker.yaml:/code/app/config.yaml
      entrypoint: [ "sh", "-c", "wait-for-it.sh mongodb:27017; wait-for-it.sh rabbitmq:5672; python3.6 -m app.scheduler" ]
      environment:
        - LANG=en_US.UTF-8
        - TZ=Asia/Shanghai

    # 本机专用入口：只绑定 127.0.0.1，默认免 Token。
    # 即使外部入口通过 Nginx/Cloudflare Tunnel 反代，也不会误判成本机请求。
    mcp-local:
      build:
        context: ./mcp
      container_name: arl_mcp_local
      restart: unless-stopped
      depends_on:
        - web
      ports:
        - "${MCP_LOCAL_BIND_IP:-127.0.0.1}:${MCP_LOCAL_PORT:-5013}:5013"
      volumes:
        - ./config-docker.yaml:/config/config-docker.yaml:ro
        - arl_mcp_data:/data
      environment:
        - TZ=Asia/Shanghai
        - MCP_HOST=0.0.0.0
        - MCP_PORT=5013
        - MCP_TOKEN=${MCP_TOKEN:-}
        - MCP_TOKEN_FILE=/data/token
        - MCP_READ_ONLY=${MCP_READ_ONLY:-true}
        - MCP_ALLOW_UNAUTHENTICATED=${MCP_ALLOW_LOCAL_UNAUTHENTICATED:-true}
        - MCP_MAX_PAGE_SIZE=${MCP_MAX_PAGE_SIZE:-200}
        - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
        - ARL_BASE_URL=${ARL_BASE_URL:-https://web}
        - ARL_API_PREFIX=/api
        - ARL_CONFIG_PATH=/config/config-docker.yaml
        - ARL_VERIFY_TLS=${ARL_VERIFY_TLS:-false}
        - ARL_TIMEOUT=${ARL_TIMEOUT:-30}
        - ARL_API_KEY=${ARL_API_KEY:-}
        - ARL_TOKEN=${ARL_TOKEN:-}
        - ARL_USERNAME=${ARL_USERNAME:-}
        - ARL_PASSWORD=${ARL_PASSWORD:-}
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5013/healthz', timeout=3)"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s

    # 外部/反向代理入口：无条件强制 Token。
    # 默认也只绑定 127.0.0.1，供本机 Nginx/Caddy/Cloudflare Tunnel 转发；
    # 确需直接监听公网时，显式设置 MCP_EXTERNAL_BIND_IP=0.0.0.0。
    mcp:
      build:
        context: ./mcp
      container_name: arl_mcp
      restart: unless-stopped
      depends_on:
        - web
      ports:
        - "${MCP_EXTERNAL_BIND_IP:-127.0.0.1}:${MCP_EXTERNAL_PORT:-5014}:5013"
      volumes:
        - ./config-docker.yaml:/config/config-docker.yaml:ro
        - arl_mcp_data:/data
      environment:
        - TZ=Asia/Shanghai
        - MCP_HOST=0.0.0.0
        - MCP_PORT=5013
        - MCP_TOKEN=${MCP_TOKEN:-}
        - MCP_TOKEN_FILE=/data/token
        - MCP_READ_ONLY=${MCP_READ_ONLY:-true}
        - MCP_ALLOW_UNAUTHENTICATED=false
        - MCP_MAX_PAGE_SIZE=${MCP_MAX_PAGE_SIZE:-200}
        - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
        - ARL_BASE_URL=${ARL_BASE_URL:-https://web}
        - ARL_API_PREFIX=/api
        - ARL_CONFIG_PATH=/config/config-docker.yaml
        - ARL_VERIFY_TLS=${ARL_VERIFY_TLS:-false}
        - ARL_TIMEOUT=${ARL_TIMEOUT:-30}
        - ARL_API_KEY=${ARL_API_KEY:-}
        - ARL_TOKEN=${ARL_TOKEN:-}
        - ARL_USERNAME=${ARL_USERNAME:-}
        - ARL_PASSWORD=${ARL_PASSWORD:-}
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5013/healthz', timeout=3)"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s

    mongodb:
        image: mongo:4.0.27
        container_name: arl_mongodb
        restart: always
        volumes:
          - arl_db:/data/db
          - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
        environment:
          - MONGO_INITDB_DATABASE=arl
          - MONGO_INITDB_ROOT_USERNAME=admin
          - MONGO_INITDB_ROOT_PASSWORD=admin


    rabbitmq:
      image: ki9mu/shadow-rabbitmq:latest
      container_name: arl_rabbitmq
      restart: always
      environment:
        - RABBITMQ_DEFAULT_PASS=arlpassword
        - RABBITMQ_DEFAULT_USER=arl
        - RABBITMQ_DEFAULT_VHOST=arlv2host
      logging:
        driver: "json-file"
        options:
          max-size: "1M"
          max-file: "10"
