name: xray-permission-validate

on:
  pull_request:
    paths:
      - 'installer/lib/51-vless-config.sh'
      - 'installer/lib/52-vless-install.sh'
      - '.github/workflows/xray-permission-validate.yml'

permissions:
  contents: read

jobs:
  xray-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch Xray config module only
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/installer/lib/51-vless-config.sh?ref=${GITHUB_SHA}" \
            >/tmp/xray-module.json
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/xray-module.json').read_text(encoding='utf-8'))
          Path('/tmp/51-vless-config-ci.sh').write_bytes(base64.b64decode(payload['content']))
          PY
          chmod 0644 /tmp/51-vless-config-ci.sh
          bash -n /tmp/51-vless-config-ci.sh

      - name: Generate and verify Xray config permissions
        shell: bash
        run: |
          set -Eeuxo pipefail
          sudo groupadd --system arl-xray-ci
          sudo useradd --system --gid arl-xray-ci --home-dir /nonexistent --shell /usr/sbin/nologin --no-create-home arl-xray-ci

          cat >/tmp/vless-config-ci.txt <<'NODES'
          vless://11111111-1111-4111-8111-111111111111@example.com:443?encryption=none&security=tls&type=ws&host=example.com&path=%2Fws#ci
          NODES

          sudo env \
            XRAY_CONFIG_MODULE=/tmp/51-vless-config-ci.sh \
            VLESS_NODES_FILE=/tmp/vless-config-ci.txt \
            XRAY_CORE_CONFIG=/tmp/xray-config-ci/config.json \
            DOCKER_GATEWAY=172.18.0.1 \
            XRAY_SOCKS_PORT=1080 \
            XRAY_SERVICE_GROUP=arl-xray-ci \
            bash -c 'set -Eeuxo pipefail; umask 077; source "$XRAY_CONFIG_MODULE"; generate_xray_core_config'

          sudo stat -c '%A %a %U:%G %n' /tmp/xray-config-ci /tmp/xray-config-ci/config.json
          test "$(sudo stat -c '%a' /tmp/xray-config-ci)" = 750
          test "$(sudo stat -c '%a' /tmp/xray-config-ci/config.json)" = 640
          test "$(sudo stat -c '%U:%G' /tmp/xray-config-ci/config.json)" = root:arl-xray-ci
          sudo -u arl-xray-ci test -r /tmp/xray-config-ci/config.json
          ! sudo -u nobody test -r /tmp/xray-config-ci/config.json
