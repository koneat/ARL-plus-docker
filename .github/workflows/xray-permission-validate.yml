name: xray-permission-validate

on:
  pull_request:
    paths:
      - 'installer/lib/51-vless-config.sh'
      - 'installer/lib/52-vless-install.sh'
      - '.github/workflows/xray-permission-validate.yml'

permissions:
  contents: read

jobs:
  xray-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate and verify Xray config permissions
        shell: bash
        run: |
          set -Eeuxo pipefail
          sudo groupadd --system arl-xray-ci
          sudo useradd --system --gid arl-xray-ci --home-dir /nonexistent --shell /usr/sbin/nologin --no-create-home arl-xray-ci

          cat >/tmp/vless-config-ci.txt <<'NODES'
          vless://11111111-1111-4111-8111-111111111111@example.com:443?encryption=none&security=tls&type=ws&host=example.com&path=%2Fws#ci
          NODES

          install -m 0644 installer/lib/51-vless-config.sh /tmp/51-vless-config-ci.sh
          sudo env \
            XRAY_CONFIG_MODULE=/tmp/51-vless-config-ci.sh \
            VLESS_NODES_FILE=/tmp/vless-config-ci.txt \
            XRAY_CORE_CONFIG=/tmp/xray-config-ci/config.json \
            DOCKER_GATEWAY=172.18.0.1 \
            XRAY_SOCKS_PORT=1080 \
            XRAY_SERVICE_GROUP=arl-xray-ci \
            bash -c 'set -Eeuxo pipefail; umask 077; source "$XRAY_CONFIG_MODULE"; generate_xray_core_config'

          stat -c '%A %a %U:%G %n' /tmp/xray-config-ci /tmp/xray-config-ci/config.json
          test "$(stat -c '%a' /tmp/xray-config-ci)" = 750
          test "$(stat -c '%a' /tmp/xray-config-ci/config.json)" = 640
          test "$(stat -c '%U:%G' /tmp/xray-config-ci/config.json)" = root:arl-xray-ci
          sudo -u arl-xray-ci test -r /tmp/xray-config-ci/config.json
          ! sudo -u nobody test -r /tmp/xray-config-ci/config.json
