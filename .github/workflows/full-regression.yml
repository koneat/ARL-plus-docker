name: full-regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDKIT_PROGRESS: quiet
  COMPOSE_PROGRESS: quiet

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run static and installer checks
        run: bash .github/scripts/full-regression-static.sh

  scanner-mcp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h
      - name: Run Scanner V2 and MCP end-to-end
        run: bash .github/scripts/full-regression.sh runtime
      - name: Show Scanner/MCP diagnostics on failure
        if: failure()
        run: |
          echo '=== docker ps ==='
          docker ps -a || true
          for c in arl-e2e-scanner arl-e2e-mcp arl-e2e-mcp-auth arl-e2e-fixture; do
            echo "=== $c logs ==="
            docker logs --tail=250 "$c" 2>&1 || true
          done
          echo '=== result files ==='
          find /tmp -path '*/results/*' -maxdepth 8 -type f -printf '%p %s bytes\n' 2>/dev/null | tail -n 300 || true
          echo '=== disk ==='
          df -h || true

  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h
      - name: Run real Compose topology
        run: bash .github/scripts/full-regression.sh compose
      - name: Show Compose diagnostics on failure
        if: failure()
        run: |
          echo '=== docker ps ==='
          docker ps -a || true
          echo '=== compose logs ==='
          docker compose logs --tail=300 --no-color || true
          echo '=== rendered mounts ==='
          docker compose config | sed -n '/services:/,$p' | grep -n -A5 -B5 '/code/frontend/report\|/work/results\|scanner-v2' || true
          echo '=== report tree ==='
          find "${ARL_REPORT_ROOT:-/var/lib/arl-reports}" -maxdepth 4 -printf '%M %u:%g %p %s bytes\n' 2>/dev/null | tail -n 300 || true
          echo '=== disk ==='
          df -h || true
