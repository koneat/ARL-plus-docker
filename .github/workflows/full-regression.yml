name: full-regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run static and installer checks
        run: bash .github/scripts/full-regression-static.sh

  scanner-mcp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h
      - name: Run Scanner V2 and MCP end-to-end
        run: bash .github/scripts/full-regression.sh runtime
      - name: Upload runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-runtime-logs
          path: |
            /tmp/**/arl-e2e-*.log
          if-no-files-found: ignore

  compose-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h
      - name: Run real Compose topology
        run: bash .github/scripts/full-regression.sh compose
      - name: Show Docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose logs --tail=300 --no-color || true
          df -h || true
