name: full-installer-validate

on:
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/full-installer-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'installer/**'
      - '.github/workflows/full-installer-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n installer/arl-full-deploy.sh
          for file in installer/lib/*.sh; do bash -n "$file"; done

      - name: Reject embedded production secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = {
              "MongoDB credential URI": re.compile(r"mongodb\+srv://[^\s:]+:[^\s@]+@"),
              "VLESS node": re.compile(r"vless://[0-9a-fA-F-]{20,}@"),
              "hard-coded API key": re.compile(
                  r"(?:FOFA_KEY|HUNTER_API_KEY|QUAKE_TOKEN|ZOOMEYE_API_KEY|SHODAN_API_KEY)="
                  r"[\"'][A-Za-z0-9_-]{16,}[\"']"
              ),
          }
          failures = []
          for path in Path("installer").rglob("*"):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      failures.append(f"{path}: {label}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("secret-isolation-ok")
          PY

      - name: Validate safe defaults
        run: |
          grep -q 'MCP_EXTERNAL_BIND_IP="${MCP_EXTERNAL_BIND_IP:-127.0.0.1}"' installer/arl-full-deploy.sh
          grep -q 'MCP_READ_ONLY="${MCP_READ_ONLY:-true}"' installer/arl-full-deploy.sh
          grep -q 'DISABLE_UFW="${DISABLE_UFW:-false}"' installer/arl-full-deploy.sh
          ! grep -q 'cat > /root/install-arl-full.sh' installer/arl-full-deploy.sh

      - name: Check no-feature configuration
        run: |
          cat >/tmp/arl.env <<'ENV'
          DISABLE_UFW=false
          ENABLE_VLESS_PROXY=false
          ENABLE_ARL_HTTP_PROXY=false
          ENABLE_CHAITIN_XRAY=false
          ENABLE_SMART_WILDCARD=true
          ENABLE_SCANNER_STACK=true
          BUILD_SCANNER_IMAGE=false
          ENABLE_WORKER_EXTENSIONS=false
          MCP_LOCAL_BIND_IP=127.0.0.1
          MCP_EXTERNAL_BIND_IP=127.0.0.1
          MCP_LOCAL_PORT=5013
          MCP_EXTERNAL_PORT=5014
          ENV
          bash installer/arl-full-deploy.sh --env-file /tmp/arl.env --check-only

      - name: Check VLESS parser
        run: |
          cat >/tmp/vless-nodes.txt <<'NODES'
          vless://11111111-1111-4111-8111-111111111111@example.com:443?encryption=none&security=tls&type=ws&host=example.com&path=%2Fws#ci
          NODES
          cat >/tmp/arl-vless.env <<'ENV'
          ENABLE_VLESS_PROXY=true
          ENABLE_ARL_HTTP_PROXY=true
          ENABLE_CHAITIN_XRAY=false
          ENABLE_WORKER_EXTENSIONS=false
          VLESS_NODES_FILE=/tmp/vless-nodes.txt
          MCP_LOCAL_BIND_IP=127.0.0.1
          MCP_EXTERNAL_BIND_IP=127.0.0.1
          MCP_LOCAL_PORT=5013
          MCP_EXTERNAL_PORT=5014
          ENV
          bash installer/arl-full-deploy.sh --env-file /tmp/arl-vless.env --check-only

      - name: Verify Xray dedicated account and config permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -q '^User=nobody$' installer/lib/52-vless-install.sh
          grep -q 'XRAY_SERVICE_USER:-arl-xray' installer/lib/52-vless-install.sh
          grep -q 'XRAY_SERVICE_GROUP:-arl-xray' installer/lib/52-vless-install.sh
          grep -q '^User=${XRAY_SERVICE_USER}$' installer/lib/52-vless-install.sh
          grep -q '^Group=${XRAY_SERVICE_GROUP}$' installer/lib/52-vless-install.sh
          grep -q 'runuser -u "$XRAY_SERVICE_USER" -- test -r "$XRAY_CORE_CONFIG"' installer/lib/52-vless-install.sh

          cat >/tmp/vless-config-ci.txt <<'NODES'
          vless://11111111-1111-4111-8111-111111111111@example.com:443?encryption=none&security=tls&type=ws&host=example.com&path=%2Fws#ci
          NODES
          sudo env \
            VLESS_NODES_FILE=/tmp/vless-config-ci.txt \
            XRAY_CORE_CONFIG=/tmp/xray-config-ci/config.json \
            DOCKER_GATEWAY=172.18.0.1 \
            XRAY_SOCKS_PORT=1080 \
            XRAY_SERVICE_GROUP=root \
            bash -c 'set -Eeuo pipefail; umask 077; source installer/lib/51-vless-config.sh; generate_xray_core_config'

          test "$(stat -c '%a' /tmp/xray-config-ci)" = 750
          test "$(stat -c '%a' /tmp/xray-config-ci/config.json)" = 640
          test "$(stat -c '%U:%G' /tmp/xray-config-ci/config.json)" = root:root
          sudo -u nobody test ! -r /tmp/xray-config-ci/config.json
          sudo -u root test -r /tmp/xray-config-ci/config.json

      - name: Reject public no-auth MCP binding
        run: |
          cat >/tmp/arl-bad.env <<'ENV'
          ENABLE_VLESS_PROXY=false
          ENABLE_ARL_HTTP_PROXY=false
          ENABLE_CHAITIN_XRAY=false
          ENABLE_WORKER_EXTENSIONS=false
          MCP_LOCAL_BIND_IP=0.0.0.0
          MCP_LOCAL_PORT=5013
          MCP_EXTERNAL_PORT=5014
          ENV
          if bash installer/arl-full-deploy.sh --env-file /tmp/arl-bad.env --check-only; then
            echo 'public no-auth binding was incorrectly accepted' >&2
            exit 1
          fi
