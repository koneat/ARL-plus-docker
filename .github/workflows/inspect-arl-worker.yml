name: inspect-arl-worker

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-arl-worker.yml'
      - 'enhanced-worker/**'
      - 'docker-compose.yml'
      - 'installer/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pull production ARL image
        run: docker pull ki9mu/arl-ki9mu:v3.0.1

      - name: Inspect task and service sources
        run: |
          set -euo pipefail
          cid="$(docker create ki9mu/arl-ki9mu:v3.0.1)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/code/app" /tmp/arl-app
          echo '===== task files ====='
          find /tmp/arl-app/tasks -maxdepth 2 -type f -print | sort
          echo '===== nuclei references ====='
          grep -R -n -C 8 'nuclei_scan\|NucleiScan' /tmp/arl-app/tasks /tmp/arl-app/services || true
          echo '===== task lifecycle and result writes ====='
          grep -R -n -E -C 5 'task_status|task_tag|vuln|plg_name|celery|scan.*finish|finish.*scan|save.*result|insert.*result' /tmp/arl-app/tasks | head -n 2500 || true
          echo '===== domain.py ====='
          sed -n '1,1200p' /tmp/arl-app/tasks/domain.py
          echo '===== site.py ====='
          test ! -f /tmp/arl-app/tasks/site.py || sed -n '1,1200p' /tmp/arl-app/tasks/site.py
          echo '===== celerytask.py ====='
          sed -n '1,1200p' /tmp/arl-app/celerytask.py
