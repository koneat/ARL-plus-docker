name: inspect-arl-worker

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-arl-worker.yml'
      - 'enhanced-worker/**'
      - 'docker-compose.yml'
      - 'installer/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pull production ARL image
        run: docker pull -q ki9mu/arl-ki9mu:v3.0.1 >/dev/null

      - name: Extract exact ARL scan hooks
        run: |
          set -euo pipefail
          cid="$(docker create ki9mu/arl-ki9mu:v3.0.1)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/code/app" /tmp/arl-app

          echo '===== exact nuclei references ====='
          grep -R -n 'nuclei_scan\|NucleiScan' /tmp/arl-app/tasks /tmp/arl-app/services || true

          echo '===== DomainTask scan stages 880-1120 ====='
          sed -n '880,1120p' /tmp/arl-app/tasks/domain.py

          echo '===== DomainTask lifecycle 1120-1320 ====='
          sed -n '1120,1320p' /tmp/arl-app/tasks/domain.py

          echo '===== vuln persistence references ====='
          grep -R -l 'plg_name' /tmp/arl-app | sort
          for file in $(grep -R -l 'plg_name' /tmp/arl-app/tasks /tmp/arl-app/services /tmp/arl-app/modules 2>/dev/null | sort); do
            echo "--- $file"
            grep -n -C 8 'plg_name' "$file" | head -n 160
          done
