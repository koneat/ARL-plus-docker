name: vendor-wordlists

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vendor-wordlists.yml'

permissions:
  contents: write

concurrency:
  group: vendor-wordlists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned upstream wordlists through Git
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/seclists /tmp/fuzzdicts

          git -c http.version=HTTP/1.1 clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/danielmiessler/SecLists.git \
            /tmp/seclists
          git -C /tmp/seclists sparse-checkout set --no-cone \
            /Discovery/Web-Content/api/api-endpoints.txt \
            /Discovery/Web-Content/raft-small-files.txt \
            /LICENSE

          git -c http.version=HTTP/1.1 clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/TheKingOfDuck/fuzzDicts.git \
            /tmp/fuzzdicts
          git -C /tmp/fuzzdicts sparse-checkout set --no-cone \
            /subdomainDicts/main.txt \
            /README.md

          mkdir -p wordlists/vendor
          install -m 0644 \
            /tmp/seclists/Discovery/Web-Content/api/api-endpoints.txt \
            wordlists/vendor/api-endpoints.txt
          install -m 0644 \
            /tmp/seclists/Discovery/Web-Content/raft-small-files.txt \
            wordlists/vendor/raft-small-files.txt
          install -m 0644 \
            /tmp/fuzzdicts/subdomainDicts/main.txt \
            wordlists/vendor/subdomains-main.txt
          install -m 0644 \
            /tmp/seclists/LICENSE \
            wordlists/vendor/LICENSE.SecLists

          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'api-endpoints.txt',
              'raft-small-files.txt',
              'subdomains-main.txt',
          ):
              path = Path('wordlists/vendor') / name
              data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              if data and not data.endswith(b'\n'):
                  data += b'\n'
              path.write_bytes(data)
          PY

          API_LINES="$(grep -cve '^[[:space:]]*$' wordlists/vendor/api-endpoints.txt)"
          FUZZ_LINES="$(grep -cve '^[[:space:]]*$' wordlists/vendor/raft-small-files.txt)"
          DOMAIN_LINES="$(grep -cve '^[[:space:]]*$' wordlists/vendor/subdomains-main.txt)"

          test "$API_LINES" -ge 250
          test "$FUZZ_LINES" -ge 10000
          test "$DOMAIN_LINES" -ge 100000

          SECLISTS_COMMIT="$(git -C /tmp/seclists rev-parse HEAD)"
          FUZZDICTS_COMMIT="$(git -C /tmp/fuzzdicts rev-parse HEAD)"
          API_SHA256="$(sha256sum wordlists/vendor/api-endpoints.txt | awk '{print $1}')"
          FUZZ_SHA256="$(sha256sum wordlists/vendor/raft-small-files.txt | awk '{print $1}')"
          DOMAIN_SHA256="$(sha256sum wordlists/vendor/subdomains-main.txt | awk '{print $1}')"

          cat >wordlists/vendor/SOURCES.env <<EOF
          # Generated by .github/workflows/vendor-wordlists.yml
          SECLISTS_REPOSITORY='https://github.com/danielmiessler/SecLists'
          SECLISTS_COMMIT='${SECLISTS_COMMIT}'
          API_SOURCE_PATH='Discovery/Web-Content/api/api-endpoints.txt'
          API_LINES='${API_LINES}'
          API_SHA256='${API_SHA256}'
          FUZZ_SOURCE_PATH='Discovery/Web-Content/raft-small-files.txt'
          FUZZ_LINES='${FUZZ_LINES}'
          FUZZ_SHA256='${FUZZ_SHA256}'
          FUZZDICTS_REPOSITORY='https://github.com/TheKingOfDuck/fuzzDicts'
          FUZZDICTS_COMMIT='${FUZZDICTS_COMMIT}'
          DOMAIN_SOURCE_PATH='subdomainDicts/main.txt'
          DOMAIN_LINES='${DOMAIN_LINES}'
          DOMAIN_SHA256='${DOMAIN_SHA256}'
          EOF

          cat >wordlists/vendor/README.md <<'EOF'
          # Vendored wordlists

          These files are committed into this repository so production installation and
          Worker image builds do not depend on third-party `raw.githubusercontent.com`
          availability.

          - `api-endpoints.txt`: SecLists API endpoint paths.
          - `raft-small-files.txt`: SecLists RAFT small file names.
          - `subdomains-main.txt`: fuzzDicts subdomain labels.
          - `SOURCES.env`: pinned upstream commits, line counts and SHA256 values.
          - `LICENSE.SecLists`: upstream SecLists MIT license.

          Update snapshots only through `.github/workflows/vendor-wordlists.yml` and
          review the generated source commits/checksums before merging release changes.

          The fuzzDicts upstream repository does not currently expose a root LICENSE
          file. Its source and exact commit are recorded in `SOURCES.env`; review the
          upstream terms before redistributing the snapshot outside this repository.
          EOF

      - name: Commit vendored snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordlists/vendor
          if git diff --cached --quiet; then
            echo 'Vendored wordlists are already current.'
            exit 0
          fi
          git commit -m 'chore(wordlists): vendor pinned API, fuzz and subdomain dictionaries'
          git push origin "HEAD:${GITHUB_REF_NAME}"
