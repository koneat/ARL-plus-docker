name: final-installer-endpoint-validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'install-arl-final.sh'
      - 'install-arl-complete.sh'
      - '.github/workflows/final-installer-endpoint-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate complete installer syntax
        run: |
          set -Eeuo pipefail
          bash -n install-arl-final.sh
          bash -n install-arl-complete.sh

      - name: Validate MCP endpoint resolution
        run: |
          set -Eeuo pipefail
          export ARL_COMPLETE_INSTALLER_LIBRARY_ONLY=true
          source ./install-arl-complete.sh

          docker() {
            if [[ "$1 $2 $3" == "inspect -f {{json .NetworkSettings.Ports}}" ]]; then
              cat <<'JSON'
          {"5013/tcp":[{"HostIp":"127.0.0.1","HostPort":"5013"}],"5014/tcp":[{"HostIp":"0.0.0.0","HostPort":"5014"}]}
          JSON
              return 0
            fi
            command docker "$@"
          }

          test "$(host_bind_ip arl_mcp_local 5013)" = '127.0.0.1'
          test "$(host_bind_ip arl_mcp 5014)" = '0.0.0.0'
          test "$(mcp_test_host 0.0.0.0)" = '127.0.0.1'
          test "$(mcp_test_host 127.0.0.1)" = '127.0.0.1'
          test "$(mcp_test_host ::)" = '[::1]'
          test "$(mcp_test_host ::1)" = '[::1]'
          ! mcp_test_host '178.128.210.47/20'
          ! mcp_test_host $'127.0.0.1\r'

      - name: Reject hard-coded container port regression
        run: |
          set -Eeuo pipefail
          ! grep -Fq 'ports.get("5013/tcp")' install-arl-complete.sh
          grep -Fq 'container_port = f"{host_port}/tcp"' install-arl-complete.sh
          grep -Fq 'actual_external_bind="$(host_bind_ip arl_mcp 5014)"' install-arl-complete.sh
