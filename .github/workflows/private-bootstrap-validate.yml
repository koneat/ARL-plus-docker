name: private-bootstrap-validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/private-bootstrap.example.sh'
      - 'installer/private-bootstrap-complete.sh'
      - 'install-arl-complete.sh'
      - '.github/workflows/private-bootstrap-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax and complete release entry
        run: |
          set -euo pipefail
          entry=installer/private-bootstrap.example.sh
          complete=installer/private-bootstrap-complete.sh
          installer=install-arl-complete.sh
          bash -n "$entry"
          bash -n "$complete"
          bash -n "$installer"
          grep -q 'ARL_PRIVATE_BOOTSTRAP_VERSION=2026.07.17-final.2' "$entry"
          grep -q 'ARL_PRIVATE_BOOTSTRAP_VERSION=2026.07.17-complete.2' "$complete"
          grep -q 'ARL_COMPLETE_INSTALLER_VERSION=2026.07.17-mcp-url-safe.2' "$installer"
          grep -q 'release/2026.07.17-final' "$entry"
          grep -q 'release/2026.07.17-final' "$complete"
          grep -q 'private-bootstrap-complete.sh' "$entry"
          grep -q 'install-arl-complete.sh' "$complete"
          grep -q 'set_env_value ENABLE_CHAITIN_XRAY true' "$complete"
          grep -q 'set_env_value ARL_AUTO_AFROG_SCAN true' "$complete"
          grep -q 'set_env_value ENABLE_SCANNER_STACK true' "$complete"
          grep -q 'docker exec arl_worker arl-report-index' "$complete"
          grep -q 'https://127.0.0.1:5003/report/' "$complete"
          grep -q 'http://127.0.0.1:5013/mcp' "$complete"

      - name: Reject embedded production secrets
        run: |
          set -euo pipefail
          files='installer/private-bootstrap.example.sh installer/private-bootstrap-complete.sh install-arl-complete.sh'
          ! grep -E -q 'mongodb\+srv://[^[:space:]'"'"']+:[^[:space:]'"'"']+@' $files
          ! grep -E -q '(^|[^A-Za-z0-9])gh[pousr]_[A-Za-z0-9_]{20,}' $files
          ! grep -E -q 'sk-(proj-)?[A-Za-z0-9_-]{20,}' $files
          ! grep -E -q 'vless://[0-9a-fA-F-]{20,}' $files
          ! grep -E -q "CONTROL_PLANE_API_KEY=['\"][^$]" $files
